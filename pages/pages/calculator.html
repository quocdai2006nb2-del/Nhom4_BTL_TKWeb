<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>LUMIfood</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #000;
    }
    h2 {
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    .box {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }
    label {
      display: inline-block;
      width: 200px;
      margin-top: 5px;
    }
    input {
      padding: 4px;
      margin-top: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
    button {
      padding: 6px 12px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>LUMIFood</h1>

  <!-- PHẦN 1 -->
  <div class="box">
    <h2>1. Tính Hạn Mức Tiền Ăn Cá Nhân</h2>
    <div>
      <label>Ngân sách ban đầu:</label>
      <input type="number" id="initialBudget" oninput="calculateBudget()">
    </div>
    <div>
      <label>Tổng tiền ăn còn lại:</label>
      <input type="number" id="currentBudget" oninput="calculateBudget()">
    </div>
    <div>
      <label>Số ngày còn lại:</label>
      <input type="number" id="daysLeft" oninput="calculateBudget()">
    </div>
    <div>
      <label>Số bữa / ngày:</label>
      <input type="number" id="mealsPerDay" oninput="calculateBudget()">
    </div>
    
    <p><b>Hạn mức tối đa 1 bữa:</b> <span id="maxPerMealDisplay">0</span> VNĐ</p>
    <p><b>Quỹ tiền còn lại:</b> <span id="percentText">0%</span></p>
    <progress id="progressBar" value="0" max="100" style="width: 100%;"></progress>
    
    <br>
    <button onclick="saveAndSuggestMenu()">Gợi ý thực đơn hôm nay</button>
    <div id="menuResult" style="margin-top: 10px;"></div>
  </div>

  <!-- PHẦN 2 -->
  <div class="box">
    <h2>2. Công Cụ Chia Tiền Bill Nhóm (US06)</h2>
    <div>
      <label>Phí ship chung:</label>
      <input type="number" id="shipFee" oninput="calculateSplitBill()">
    </div>
    <div>
      <label>Voucher giảm giá:</label>
      <input type="number" id="discountVoucher" oninput="calculateSplitBill()">
    </div>

    <button onclick="addMember()">Thêm thành viên</button>

    <table>
      <thead>
        <tr>
          <th>Tên</th>
          <th>Tiền món lẻ</th>
          <th>Cần trả</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="memberList">
      </tbody>
    </table>

    <button onclick="copySplitResult()">Sao chép kết quả</button>
  </div>

  <script>
    function calculateBudget() {
      const initial = parseFloat(document.getElementById('initialBudget').value) || 0;
      const current = parseFloat(document.getElementById('currentBudget').value) || 0;
      const days = parseFloat(document.getElementById('daysLeft').value) || 0;
      const meals = parseFloat(document.getElementById('mealsPerDay').value) || 0;

      if (days <= 0 || meals <= 0 || current <= 0) {
        document.getElementById('maxPerMealDisplay').innerText = '0';
        document.getElementById('percentText').innerText = '0%';
        document.getElementById('progressBar').value = 0;
        return;
      }

      const maxPerMeal = Math.floor(current / (days * meals));
      document.getElementById('maxPerMealDisplay').innerText = maxPerMeal.toLocaleString('vi-VN');

      let percent = initial > 0 ? (current / initial) * 100 : 0;
      percent = Math.min(100, Math.max(0, percent));
      
      document.getElementById('percentText').innerText = percent.toFixed(1) + '%';
      document.getElementById('progressBar').value = percent;
    }

    function saveAndSuggestMenu() {
      const current = parseFloat(document.getElementById('currentBudget').value) || 0;
      const days = parseFloat(document.getElementById('daysLeft').value) || 0;
      const meals = parseFloat(document.getElementById('mealsPerDay').value) || 0;

      if (days <= 0 || meals <= 0 || current <= 0) {
        alert("Nhập đủ thông tin đi bạn ơi!");
        return;
      }

      const maxPerMeal = Math.floor(current / (days * meals));
      localStorage.setItem('lumifood_max_per_meal', maxPerMeal);
      document.getElementById('menuResult').innerText = "Đã lưu hạn mức " + maxPerMeal.toLocaleString('vi-VN') + " VNĐ vào localStorage!";
    }

    let members = [];

    function renderMembers() {
      const tbody = document.getElementById('memberList');
      tbody.innerHTML = '';

      members.forEach((m, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" value="${m.name}" onchange="updateMember(${index}, 'name', this.value)"></td>
          <td><input type="number" value="${m.price || ''}" onchange="updateMember(${index}, 'price', this.value)"></td>
          <td><span id="final-${index}">0</span> đ</td>
          <td><button onclick="removeMember(${index})">Xóa</button></td>
        `;
        tbody.appendChild(tr);
      });

      calculateSplitBill();
    }

    function addMember() {
      members.push({ name: '', price: 0, finalAmount: 0 });
      renderMembers();
    }

    function removeMember(index) {
      members.splice(index, 1);
      renderMembers();
    }

    function updateMember(index, field, value) {
      if (field === 'price') {
        members[index].price = parseFloat(value) || 0;
      } else {
        members[index].name = value;
      }
      calculateSplitBill();
    }

    function calculateSplitBill() {
      const shipFee = parseFloat(document.getElementById('shipFee').value) || 0;
      const discount = parseFloat(document.getElementById('discountVoucher').value) || 0;
      
      const totalItemsPrice = members.reduce((sum, m) => sum + m.price, 0);
      const netExtra = shipFee - discount;

      members.forEach((m, index) => {
        let finalAmount = m.price;
        if (totalItemsPrice > 0) {
          finalAmount = m.price + (netExtra * (m.price / totalItemsPrice));
        }
        m.finalAmount = Math.round(finalAmount);
        const span = document.getElementById(`final-${index}`);
        if (span) {
          span.innerText = m.finalAmount.toLocaleString('vi-VN');
        }
      });
    }

    function copySplitResult() {
      let text = "Bill LUMIfood:\n";
      members.forEach(m => {
        text += "- " + (m.name || "Ai đó") + ": " + m.finalAmount.toLocaleString('vi-VN') + " đ\n";
      });
      navigator.clipboard.writeText(text).then(() => alert("Đã copy!"));
    }
  </script>
</body>
</html>
