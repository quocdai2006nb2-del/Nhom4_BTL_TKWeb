<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>FOOD CALCULATOR</h1>

        <-- PHẦN 1: HẠN MỨC ĂN CÁ NHÂN -->
        <div class="card">

            <h2>1. Tính hạn mức ăn cá nhân</h2>

            <label>Ngân sách ăn uống tháng (VNĐ)</label>
            <input type="number" id="budget"
                   placeholder="Ví dụ: 3000000">

            <label>Số ngày trong tháng</label>
            <input type="number" id="days"
                   placeholder="Ví dụ: 30">

            <label>Số bữa ăn mỗi ngày</label>
            <input type="number" id="meals"
                   placeholder="Ví dụ: 3">

            <button onclick="calculateLimit()">
                Tính hạn mức
            </button>

            <div id="limitResult" class="result"></div>

        </div>


        <-- PHẦN 2: CHIA BILL NHÓM -->
        <div class="card">

            <h2>2. Tính bill nhóm</h2>

            <label>Tổng bill (VNĐ)</label>
            <input type="number" id="totalBill"
                   placeholder="Ví dụ: 500000">

            <label>Số người</label>
            <input type="number" id="numberOfPeople"
                   min="1"
                   placeholder="Ví dụ: 3">

            <button onclick="createPeopleForm()">
                Nhập thông tin người
            </button>

            <div id="peopleForm"></div>

            <button onclick="splitBill()">
                Chia bill
            </button>

        </div>


        <-- PHẦN 3: BẢNG KẾT QUẢ -->
        <div class="card">

            <h2>3. Kết quả chia tiền</h2>

            <table>

                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Người</th>
                        <th>Phần ăn</th>
                        <th>Phải trả</th>
                        <th>Đã trả</th>
                        <th>Chênh lệch</th>
                    </tr>
                </thead>

                <tbody id="resultBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="calculator.js"></script>

</body>
</html>
